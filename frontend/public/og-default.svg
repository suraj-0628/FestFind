<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#0f1729"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="100" r="200" fill="rgba(0,212,255,0.05)"/>
  <circle cx="1050" cy="530" r="250" fill="rgba(124,58,237,0.05)"/>
  <circle cx="600" cy="315" r="150" fill="rgba(0,212,255,0.03)"/>

  <!-- Map dots (simplified India outline) -->
  <g opacity="0.15" fill="#00d4ff">
    <circle cx="580" cy="180" r="3"/>
    <circle cx="620" cy="200" r="2.5"/>
    <circle cx="550" cy="220" r="2"/>
    <circle cx="600" cy="240" r="3"/>
    <circle cx="640" cy="260" r="2"/>
    <circle cx="560" cy="280" r="2.5"/>
    <circle cx="610" cy="300" r="3.5"/>
    <circle cx="580" cy="320" r="2"/>
    <circle cx="630" cy="340" r="2.5"/>
    <circle cx="590" cy="360" r="3"/>
    <circle cx="540" cy="380" r="2"/>
    <circle cx="620" cy="400" r="2.5"/>
    <circle cx="570" cy="420" r="2"/>
    <circle cx="610" cy="440" r="3"/>
    <circle cx="580" cy="460" r="2.5"/>
  </g>

  <!-- Glowing pin markers -->
  <g>
    <circle cx="480" cy="200" r="6" fill="#22c55e" opacity="0.8"/>
    <circle cx="480" cy="200" r="12" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
    <circle cx="700" cy="280" r="6" fill="#f472b6" opacity="0.8"/>
    <circle cx="700" cy="280" r="12" fill="none" stroke="#f472b6" stroke-width="1" opacity="0.3"/>
    <circle cx="550" cy="350" r="5" fill="#00d4ff" opacity="0.8"/>
    <circle cx="650" cy="180" r="5" fill="#f472b6" opacity="0.6"/>
    <circle cx="520" cy="300" r="4" fill="#22c55e" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="600" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-2">
    FestFind
  </text>

  <!-- Accent line -->
  <rect x="420" y="260" width="360" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="rgba(255,255,255,0.7)">
    Discover College Events Across India
  </text>

  <!-- Feature pills -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">
    <rect x="310" y="360" width="140" height="36" rx="18" fill="rgba(0,212,255,0.15)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
    <text x="380" y="383" text-anchor="middle" fill="#00d4ff">Interactive Map</text>

    <rect x="470" y="360" width="130" height="36" rx="18" fill="rgba(124,58,237,0.15)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
    <text x="535" y="383" text-anchor="middle" fill="#a78bfa">Live Events</text>

    <rect x="620" y="360" width="160" height="36" rx="18" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
    <text x="700" y="383" text-anchor="middle" fill="#22c55e">Host Your Fest</text>
  </g>

  <!-- URL -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.4)">
    festfind.live
  </text>
</svg>
